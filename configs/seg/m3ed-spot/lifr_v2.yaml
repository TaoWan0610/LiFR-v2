EXPERIMENT:
  MODE: event_seg_refine
  DURATION_MS: 40
DEVICE: cuda
SAVE_DIR: ${OUTPUT_ROOT}/seg/m3ed-spot/lifr_v2
MODEL:
  NAME: LiFRV2
  RESUME: ''
  INIT_CHECKPOINT: ''
  INIT_CHECKPOINT_STRICT: true
  HRM_LAYERS: 4
  BASE_CHECKPOINT: ${WEIGHTS_ROOT}/seg/hrm_m3ed_spot.pt
  EVENT_ENCODER_CHECKPOINT: ${WEIGHTS_ROOT}/seg/event_encoder_m3ed_spot.pt
DATASET:
  NAME: M3ED
  TYPE: m3ed
  EXPERIMENT_NAME: m3ed-spot_refine
  ROOT: ${DATA_ROOT}/m3ed-spot
  FRAME_INTERVAL_MS: 40
  FRAME_INDEX_STRIDE: 1
  IGNORE_LABEL: 255
  MODALS:
  - img
  SAMPLE_GAP: 0
  VAL_SAMPLE_GAP: 9
  TRAIN_SEQUENCES: null
  VAL_SEQUENCES: null
  TRAIN_EXCLUDE_SEQUENCES: null
  VAL_EXCLUDE_SEQUENCES: null
  ID: m3ed-spot
TRAIN:
  IMAGE_SIZE:
  - 360
  - 640
  BATCH_SIZE: 4
  NUM_WORKERS: 8
  PREFETCH_FACTOR: 4
  EPOCHS: 100
  EVAL_START: 0
  EVAL_INTERVAL: 1
  AMP: true
  AMP_DTYPE: bfloat16
  GRAD_CLIP_NORM: 1.0
  MAX_CONSECUTIVE_NONFINITE: 3
  DDP: false
  FIND_UNUSED_PARAMETERS: true
  LOG_INTERVAL: 20
  COMPACT_OUTPUT: true
  SAVE_TRAINING_STATE: true
  STAGE: completion
  GATE_SCHEDULE: fixed
  GATE_ALPHA: 0.01
LOSS:
  NAME: CrossEntropy
OPTIMIZER:
  NAME: adamw
  LR: 0.0001
  DECODER_LR: 1.0e-05
  WEIGHT_DECAY: 0.005
SCHEDULER:
  NAME: warmuppolylr
  POWER: 0.95
  WARMUP: 1
  WARMUP_RATIO: 0.25
EVAL:
  IMAGE_SIZE:
  - 360
  - 640
  BATCH_SIZE: 4
  NUM_WORKERS: 8
  PREFETCH_FACTOR: 4
  SAVE_VISUALIZATIONS: false
