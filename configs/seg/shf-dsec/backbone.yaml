EXPERIMENT:
  MODE: backbone
  DURATION_MS: 0
DEVICE: cuda
SAVE_DIR: ${OUTPUT_ROOT}/seg/shf-dsec/backbone
MODEL:
  NAME: RGBBackbone
  RESUME: ''
  INIT_CHECKPOINT: ''
  INIT_CHECKPOINT_STRICT: true
  PRETRAINED: ${WEIGHTS_ROOT}/seg/mit_b2.pth
DATASET:
  NAME: SHFDSEC
  TYPE: carla
  EXPERIMENT_NAME: shf-dsec_propagation
  ROOT: ${DATA_ROOT}/shf-dsec
  FRAME_INTERVAL_MS: 50
  FRAME_INDEX_STRIDE: 1
  IGNORE_LABEL: 255
  MODALS:
  - img
  SAMPLE_GAP: 0
  VAL_SAMPLE_GAP: 0
  TRAIN_SEQUENCES: null
  VAL_SEQUENCES: null
  TRAIN_EXCLUDE_SEQUENCES: null
  VAL_EXCLUDE_SEQUENCES: null
  ID: shf-dsec
TRAIN:
  IMAGE_SIZE:
  - 440
  - 640
  BATCH_SIZE: 4
  NUM_WORKERS: 8
  PREFETCH_FACTOR: 4
  EPOCHS: 100
  EVAL_START: 0
  EVAL_INTERVAL: 1
  AMP: true
  AMP_DTYPE: bfloat16
  GRAD_CLIP_NORM: 1.0
  MAX_CONSECUTIVE_NONFINITE: 3
  DDP: true
  FIND_UNUSED_PARAMETERS: false
  LOG_INTERVAL: 20
  COMPACT_OUTPUT: true
  SAVE_TRAINING_STATE: true
  STAGE: backbone
LOSS:
  NAME: OhemCrossEntropy
OPTIMIZER:
  NAME: adamw
  LR: 0.0001
  OVERRIDE_RESUME_LR: false
  WEIGHT_DECAY: 0.005
  DECODER_LR: 0.0001
SCHEDULER:
  NAME: warmuppolylr
  POWER: 0.95
  WARMUP: 5
  WARMUP_RATIO: 0.1
EVAL:
  IMAGE_SIZE:
  - 440
  - 640
  BATCH_SIZE: 4
  NUM_WORKERS: 8
  PREFETCH_FACTOR: 4
  SAVE_VISUALIZATIONS: false
