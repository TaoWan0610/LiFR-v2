EXPERIMENT:
  MODE: query
  DURATION_MS: 50
DEVICE: cuda
SAVE_DIR: ${OUTPUT_ROOT}/seg/shf-emergy/lifr_v1
MODEL:
  NAME: LiFRV1
  RESUME: ''
  INIT_CHECKPOINT: ''
  INIT_CHECKPOINT_STRICT: true
  BACKBONE_CHECKPOINT: ${WEIGHTS_ROOT}/seg/backbone_shf_emergy.pt
  RESUME_FLOWNET: ${WEIGHTS_ROOT}/flownet/dsec.tar
DATASET:
  NAME: SHFEmerge
  TYPE: carla
  EXPERIMENT_NAME: shf-emergy_propagation
  ROOT: ${DATA_ROOT}/shf_emergy
  FRAME_INTERVAL_MS: 50
  FRAME_INDEX_STRIDE: 1
  IGNORE_LABEL: 255
  MODALS:
  - img
  SAMPLE_GAP: 0
  VAL_SAMPLE_GAP: 0
  ID: shf-emergy
TRAIN:
  IMAGE_SIZE:
  - 440
  - 640
  BATCH_SIZE: 4
  NUM_WORKERS: 8
  PREFETCH_FACTOR: 2
  EPOCHS: 100
  EVAL_START: 0
  EVAL_INTERVAL: 1
  AMP: true
  AMP_DTYPE: bfloat16
  GRAD_CLIP_NORM: 1.0
  MAX_CONSECUTIVE_NONFINITE: 3
  DDP: true
  FIND_UNUSED_PARAMETERS: true
  LOG_INTERVAL: 20
  COMPACT_OUTPUT: true
  STAGE: propagation
LOSS:
  NAME: OhemCrossEntropy
OPTIMIZER:
  NAME: adamw
  LR: 0.0001
  OVERRIDE_RESUME_LR: false
  WEIGHT_DECAY: 0.005
SCHEDULER:
  NAME: warmuppolylr
  POWER: 0.95
  WARMUP: 5
  WARMUP_RATIO: 0.1
EVAL:
  IMAGE_SIZE:
  - 440
  - 640
  BATCH_SIZE: 4
  NUM_WORKERS: 8
  PREFETCH_FACTOR: 2
  SAVE_VISUALIZATIONS: false
