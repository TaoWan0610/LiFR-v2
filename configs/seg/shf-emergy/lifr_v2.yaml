EXPERIMENT:
  MODE: event_seg_refine
  DURATION_MS: 50
DEVICE: cuda
SAVE_DIR: ${OUTPUT_ROOT}/seg/shf-emergy/lifr_v2
MODEL:
  NAME: LiFRV2
  RESUME: ''
  INIT_CHECKPOINT: ''
  INIT_CHECKPOINT_STRICT: true
  HRM_LAYERS: 4
  BASE_CHECKPOINT: ${WEIGHTS_ROOT}/seg/hrm_shf_emergy.pt
  EVENT_ENCODER_CHECKPOINT: ${WEIGHTS_ROOT}/seg/event_encoder_shf_emergy.pt
DATASET:
  NAME: SHFEmerge
  TYPE: carla
  EXPERIMENT_NAME: shf-emergy_refine
  ROOT: ${DATA_ROOT}/shf_emergy
  FRAME_INTERVAL_MS: 50
  FRAME_INDEX_STRIDE: 1
  IGNORE_LABEL: 255
  MODALS:
  - img
  SAMPLE_GAP: 0
  VAL_SAMPLE_GAP: 0
  ID: shf-emergy
TRAIN:
  IMAGE_SIZE:
  - 440
  - 640
  BATCH_SIZE: 4
  NUM_WORKERS: 8
  PREFETCH_FACTOR: 2
  EPOCHS: 100
  EVAL_START: 0
  EVAL_INTERVAL: 1
  AMP: true
  AMP_DTYPE: bfloat16
  GRAD_CLIP_NORM: 1
  MAX_CONSECUTIVE_NONFINITE: 3
  DDP: true
  FIND_UNUSED_PARAMETERS: true
  LOG_INTERVAL: 20
  COMPACT_OUTPUT: true
  SAVE_TRAINING_STATE: true
  STAGE: completion
  GATE_SCHEDULE: fixed
  GATE_ALPHA: 0.01
LOSS:
  NAME: CrossEntropy
OPTIMIZER:
  NAME: adamw
  LR: 0.0001
  DECODER_LR: 1.0e-05
  WEIGHT_DECAY: 0.005
  GATE_LR: 0.0001
SCHEDULER:
  NAME: warmuppolylr
  POWER: 0.95
  WARMUP: 1
  WARMUP_RATIO: 0.25
EVAL:
  IMAGE_SIZE:
  - 440
  - 640
  BATCH_SIZE: 4
  NUM_WORKERS: 8
  PREFETCH_FACTOR: 2
  SAVE_VISUALIZATIONS: false
